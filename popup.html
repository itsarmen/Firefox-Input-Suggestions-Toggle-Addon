<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <div class="row">
      <div class="labels">
        <div class="title">Input suggestions</div>
        <div id="status" class="status">Checking…</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <p class="hint">
      Turns the browser's form &amp; input value suggestion dropdown on or off for all websites.
    </p>
    <p class="hint rate">
      Enjoying it? <a href="https://addons.mozilla.org/en-US/firefox/addon/input-suggestions-toggle/" target="_blank" rel="noopener">Rate &amp; review on Firefox Add-ons</a>
    </p>
    <footer class="author">
      By <a href="https://xrow.asia" target="_blank" rel="noopener">Amiran Kimadze (itsarmen)</a>
      &middot; <a href="mailto:amoswaper@gmail.com">amoswaper@gmail.com</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
